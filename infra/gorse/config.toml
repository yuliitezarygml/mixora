[database]
cache_store = "redis://redis:6379/0"
data_store = "postgres://mixora:mixora@postgres:5432/mixora?sslmode=disable"
table_prefix = "gorse_"

[master]
host = "0.0.0.0"
port = 8086
http_host = "0.0.0.0"
http_port = 8088
n_jobs = 1
dashboard_user_name = ""
dashboard_password = ""

[server]
default_n = 50
api_key = ""
auto_insert_user = true
auto_insert_item = true
cache_expire = "10s"

[recommend]
cache_size = 200
cache_expire = "72h"
context_size = 200
active_user_ttl = 0

[recommend.search]
columns = ["item.Comment"]

[recommend.data_source]
positive_feedback_types = ["listen_30s", "complete", "repeat", "like", "add_to_playlist"]
read_feedback_types = ["impression", "play", "seek"]
negative_feedback_types = ["skip", "dislike"]
positive_feedback_ttl = 0
item_ttl = 0

[recommend.collaborative]
type = "mf"
fit_period = "10m"
fit_epoch = 50
optimize_period = "0"
optimize_trials = 5

[recommend.collaborative.early_stopping]
patience = 5

[recommend.ranker]
type = "fm"
cache_expire = "24h"
recommenders = ["latest", "collaborative"]
fit_period = "10m"
fit_epoch = 50
optimize_period = "0"
optimize_trials = 5

[recommend.ranker.early_stopping]
patience = 5

[recommend.fallback]
recommenders = ["latest"]

[blob]
uri = "/var/lib/gorse/blob"
