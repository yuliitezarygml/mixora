name: mixora

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mixora}
      POSTGRES_USER: ${POSTGRES_USER:-mixora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mixora}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mixora_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - mixora_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 1000
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./beckend
    environment:
      MIXORA_HTTP_ADDR: :8080
      MIXORA_ENV: ${MIXORA_ENV:-development}
      MIXORA_DATABASE_URL: postgres://${POSTGRES_USER:-mixora}:${POSTGRES_PASSWORD:-mixora}@postgres:5432/${POSTGRES_DB:-mixora}?sslmode=disable
      MIXORA_REDIS_ADDR: redis:6379
      MIXORA_PUBLIC_URL: ${MIXORA_PUBLIC_URL:-http://127.0.0.1:5174}
      MIXORA_COOKIE_SECURE: ${MIXORA_COOKIE_SECURE:-false}
      MIXORA_SESSION_TTL: ${MIXORA_SESSION_TTL:-720h}
      MIXORA_SMTP_ADDR: mailpit:1025
      MIXORA_SMTP_FROM: ${MIXORA_SMTP_FROM:-Mixora <noreply@mixora.local>}
      MIXORA_SMTP_USERNAME: ${MIXORA_SMTP_USERNAME:-}
      MIXORA_SMTP_PASSWORD: ${MIXORA_SMTP_PASSWORD:-}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 4s
      retries: 20
    restart: unless-stopped

volumes:
  mixora_postgres:
  mixora_redis:
