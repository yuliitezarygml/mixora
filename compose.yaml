name: mixora

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mixora}
      POSTGRES_USER: ${POSTGRES_USER:-mixora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mixora}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mixora_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - mixora_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 1000
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  gorse:
    image: zhenghaoz/gorse-in-one:0.5.11
    profiles: ["recommendations"]
    environment:
      GORSE_CACHE_STORE: redis://redis:6379/0
      GORSE_DATA_STORE: postgres://${POSTGRES_USER:-mixora}:${POSTGRES_PASSWORD:-mixora}@postgres:5432/${POSTGRES_DB:-mixora}?sslmode=disable
      GORSE_TABLE_PREFIX: gorse_
      GORSE_SERVER_API_KEY: ${GORSE_API_KEY:-mixora-local-gorse-key}
      GORSE_DASHBOARD_USER_NAME: ${GORSE_DASHBOARD_USER_NAME:-mixora}
      GORSE_DASHBOARD_PASSWORD: ${GORSE_DASHBOARD_PASSWORD:-mixora-local}
    ports:
      - "127.0.0.1:${GORSE_PORT:-8088}:8088"
    volumes:
      - ./infra/gorse/config.toml:/etc/gorse/config.toml:ro
      - mixora_gorse:/var/lib/gorse
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8088; printf 'GET /api/health/ready HTTP/1.0\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.34.1}
    profiles: ["embeddings"]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - mixora_ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=http://127.0.0.1:11434 ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  ollama-pull:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.34.1}
    profiles: ["embeddings"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${MIXORA_EMBEDDINGS_MODEL:-embeddinggemma:300m-qat-q4_0}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./beckend
    environment:
      MIXORA_HTTP_ADDR: :8080
      MIXORA_ENV: ${MIXORA_ENV:-development}
      MIXORA_DATABASE_URL: postgres://${POSTGRES_USER:-mixora}:${POSTGRES_PASSWORD:-mixora}@postgres:5432/${POSTGRES_DB:-mixora}?sslmode=disable
      MIXORA_REDIS_ADDR: redis:6379
      MIXORA_PUBLIC_URL: ${MIXORA_PUBLIC_URL:-http://127.0.0.1:5174}
      MIXORA_COOKIE_SECURE: ${MIXORA_COOKIE_SECURE:-false}
      MIXORA_SESSION_TTL: ${MIXORA_SESSION_TTL:-720h}
      MIXORA_SMTP_ADDR: mailpit:1025
      MIXORA_SMTP_FROM: ${MIXORA_SMTP_FROM:-Mixora <noreply@mixora.local>}
      MIXORA_SMTP_USERNAME: ${MIXORA_SMTP_USERNAME:-}
      MIXORA_SMTP_PASSWORD: ${MIXORA_SMTP_PASSWORD:-}
      MIXORA_GORSE_URL: ${MIXORA_GORSE_URL:-}
      MIXORA_GORSE_API_KEY: ${GORSE_API_KEY:-mixora-local-gorse-key}
      MIXORA_GORSE_TIMEOUT: ${MIXORA_GORSE_TIMEOUT:-3s}
      MIXORA_EMBEDDINGS_URL: ${MIXORA_EMBEDDINGS_URL:-}
      MIXORA_EMBEDDINGS_MODEL: ${MIXORA_EMBEDDINGS_MODEL:-embeddinggemma:300m-qat-q4_0}
      MIXORA_EMBEDDINGS_VERSION: ${MIXORA_EMBEDDINGS_VERSION:-embeddinggemma-q4-768-doc-v1}
      MIXORA_EMBEDDINGS_DIMENSIONS: ${MIXORA_EMBEDDINGS_DIMENSIONS:-768}
      MIXORA_EMBEDDINGS_TIMEOUT: ${MIXORA_EMBEDDINGS_TIMEOUT:-2m}
      MIXORA_EMBEDDINGS_BATCH_SIZE: ${MIXORA_EMBEDDINGS_BATCH_SIZE:-16}
      MIXORA_YTDLP_TIMEOUT: ${MIXORA_YTDLP_TIMEOUT:-30s}
      MIXORA_YTDLP_MAX_CONCURRENT: ${MIXORA_YTDLP_MAX_CONCURRENT:-2}
      # Public metadata search works without these. Supplying Spotify
      # credentials switches the adapter to Spotify's official Web API.
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      # Optional in-container path; mount a cookies.txt file only when a
      # single-user local development runtime needs a signed-in browser
      # session. This compose file deliberately mounts no cookies.
      MIXORA_YTDLP_COOKIES_FILE: ${MIXORA_YTDLP_COOKIES_FILE:-}
      MIXORA_ALLOW_SHARED_YTDLP_COOKIES: ${MIXORA_ALLOW_SHARED_YTDLP_COOKIES:-false}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
        required: ${MIXORA_EMBEDDINGS_REQUIRED:-false}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 4s
      retries: 20
    restart: unless-stopped

volumes:
  mixora_postgres:
  mixora_redis:
  mixora_gorse:
  mixora_ollama:
